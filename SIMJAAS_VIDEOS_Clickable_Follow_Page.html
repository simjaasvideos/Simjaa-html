<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#f8fbff,#fff7ef);
  display:flex; align-items:center; justify-content:center; padding:24px;
  color:#122a55;
}
.card {
  width:min(680px,100%); background:white; border-radius:28px;
  padding:28px; text-align:center; box-shadow:0 18px 50px rgba(18,42,85,.16);
  border:1px solid #eef2f7;
}
.logo { width:min(420px,90%); border-radius:18px; margin:0 auto 12px; display:block; }
h1 { margin:10px 0 6px; font-size:clamp(28px,6vw,44px); }
.subtitle { font-size:18px; margin:0 0 24px; color:#53627a; }
.btn {
  display:flex; align-items:center; justify-content:center; gap:12px;
  width:100%; padding:18px 20px; margin:14px 0; border-radius:16px;
  color:white; text-decoration:none; font-size:20px; font-weight:700;
  transition:transform .15s, box-shadow .15s;
}
.btn:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.16); }
.fb { background:#1877F2; }
.ig { background:linear-gradient(90deg,#833AB4,#E1306C,#F77737); }
.icon { font-size:28px; }
.note { margin-top:22px; font-size:14px; color:#78869a; }
.footer { margin-top:18px; font-weight:700; }
</style>
